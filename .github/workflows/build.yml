name: Build TV Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate High-Res App Icons
        run: |
          pip install pillow
          python3 -c "
          import os
          from PIL import Image, ImageDraw

          for folder, size in [('mipmap-mdpi', 48), ('mipmap-hdpi', 72), ('mipmap-xhdpi', 96), ('mipmap-xxhdpi', 144), ('mipmap-xxxhdpi', 192)]:
              path = f'app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              img = Image.new('RGBA', (size, size), (15, 23, 42, 255))
              draw = ImageDraw.Draw(img)
              
              pad = int(size * 0.14)
              draw.rounded_rectangle([pad, pad, size-pad, size-pad], radius=int(size*0.18), outline=(56, 189, 248, 255), width=max(2, int(size*0.05)))
              
              cx, cy = size // 2, size // 2
              tri = int(size * 0.18)
              draw.polygon([(cx - tri//2, cy - tri), (cx - tri//2, cy + tri), (cx + tri, cy)], fill=(251, 191, 36, 255))
              
              img.save(f'{path}/ic_launcher.png')
              img.save(f'{path}/ic_launcher_round.png')
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Palestine-TV-Launcher
          path: app/build/outputs/apk/debug/app-debug.apk
