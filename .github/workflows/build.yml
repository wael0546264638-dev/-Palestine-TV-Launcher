name: Build TV Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-fix XML namespaces
        run: |
          python3 -c '
          import re
          path = "app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              text = f.read()
          attrs = ["name", "exported", "launchMode", "stateNotNeeded", "allowBackup", "label", "supportsRtl", "theme", "authorities", "grantUriPermissions", "resource", "required"]
          for a in attrs:
              text = re.sub(r"(?<!android:)\b" + a + r"=", "android:" + a + "=", text)
          with open(path, "w") as f:
              f.write(text)
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Palestine-TV-Launcher
          path: app/build/outputs/apk/debug/app-debug.apk
