name: Build TV Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Manifest
        run: |
          python3 -c '
          a = "".join(chr(c) for c in)
          x = "".join(chr(c) for c in)
          s = "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n"
          s += "<manifest " + x + "=\"http://android.com\">\n"
          s += "  <uses-permission " + a + "name=\"android.permission.INTERNET\" />\n"
          s += "  <uses-permission " + a + "name=\"android.permission.ACCESS_NETWORK_STATE\" />\n"
          s += "  <uses-permission " + a + "name=\"android.permission.QUERY_ALL_PACKAGES\" />\n"
          s += "  <uses-permission " + a + "name=\"android.permission.REQUEST_INSTALL_PACKAGES\" />\n"
          s += "  <uses-feature " + a + "name=\"android.software.leanback\" " + a + "required=\"true\" />\n"
          s += "  <uses-feature " + a + "name=\"android.hardware.touchscreen\" " + a + "required=\"false\" />\n"
          s += "  <application " + a + "allowBackup=\"true\" " + a + "label=\"Palestine TV\" " + a + "supportsRtl=\"true\" " + a + "theme=\"@android:style/Theme.NoTitleBar.Fullscreen\">\n"
          s += "    <activity " + a + "name=\".MainActivity\" " + a + "exported=\"true\" " + a + "launchMode=\"singleTask\" " + a + "stateNotNeeded=\"true\">\n"
          s += "      <intent-filter>\n"
          s += "        <action " + a + "name=\"android.intent.action.MAIN\" />\n"
          s += "        <category " + a + "name=\"android.intent.category.HOME\" />\n"
          s += "        <category " + a + "name=\"android.intent.category.DEFAULT\" />\n"
          s += "        <category " + a + "name=\"android.intent.category.LEANBACK_LAUNCHER\" />\n"
          s += "      </intent-filter>\n"
          s += "    </activity>\n"
          s += "    <provider " + a + "name=\"androidx.core.content.FileProvider\" " + a + "authorities=\"${applicationId}.fileprovider\" " + a + "exported=\"false\" " + a + "grantUriPermissions=\"true\">\n"
          s += "      <meta-data " + a + "name=\"android.support.FILE_PROVIDER_PATHS\" " + a + "resource=\"@xml/file_paths\" />\n"
          s += "    </provider>\n"
          s += "  </application>\n"
          s += "</manifest>"
          open("app/src/main/AndroidManifest.xml", "w").write(s)
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Palestine-TV-Launcher
          path: app/build/outputs/apk/debug/app-debug.apk
