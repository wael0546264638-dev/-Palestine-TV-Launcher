name: Build TV Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Manifest via Python
        run: |
          python3 -c '
          p = "android" + chr(58)
          xml = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns""" + chr(58) + """android="http://android.com">
              <uses-permission """ + p + """name="android.permission.INTERNET" />
              <uses-permission """ + p + """name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission """ + p + """name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission """ + p + """name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-feature """ + p + """name="android.software.leanback" """ + p + """required="true" />
              <uses-feature """ + p + """name="android.hardware.touchscreen" """ + p + """required="false" />
              <application
                  """ + p + """allowBackup="true"
                  """ + p + """label="Palestine TV Launcher"
                  """ + p + """supportsRtl="true"
                  """ + p + """theme="@android""" + chr(58) + """style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      """ + p + """name=".MainActivity"
                      """ + p + """exported="true"
                      """ + p + """launchMode="singleTask"
                      """ + p + """stateNotNeeded="true">
                      <intent-filter>
                          <action """ + p + """name="android.intent.action.MAIN" />
                          <category """ + p + """name="android.intent.category.HOME" />
                          <category """ + p + """name="android.intent.category.DEFAULT" />
                          <category """ + p + """name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      """ + p + """name="androidx.core.content.FileProvider"
                      """ + p + """authorities="${applicationId}.fileprovider"
                      """ + p + """exported="false"
                      """ + p + """grantUriPermissions="true">
                      <meta-data
                          """ + p + """name="android.support.FILE_PROVIDER_PATHS"
                          """ + p + """resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Palestine-TV-Launcher
          path: app/build/outputs/apk/debug/app-debug.apk
